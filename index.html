<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Spelcafé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Bungee&display=swap">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
/* Layout: een stad bij schemering. Links het bord, rechts het dashboard van de tuk-tuk. */
:root{
  color-scheme:dark;
  --dusk:#1b1839;
  --dusk-2:#262252;
  --dusk-3:#352f6b;
  --line:#4c4590;
  --ink:#f7f3ff;
  --muted:#b9b2dd;
  --taxi:#ffc61e;
  --taxi-ink:#241a00;
  --tuk:#7a5cf0;
  --stop:#e0303a;
  --go:#2fb673;
  --road:#3a3850;
  --road-line:#e8e2ff;
  --block:#2c5a4c;
  --kans:#ff8a1f;
  --f-sign:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--dusk);color:var(--ink);font:500 16px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 20px}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px;max-width:1240px;margin-inline:auto}
.brand{font:400 clamp(22px,4vw,30px)/1 var(--f-sign);color:var(--taxi);letter-spacing:.01em}
.brand span{color:var(--ink)}
.tag{font:600 14px/1.1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right}
.checker{height:14px;max-width:1240px;margin:0 auto 12px;border-radius:2px;
  background:conic-gradient(#111 25%,var(--taxi) 0 50%,#111 0 75%,var(--taxi) 0) 0 0/14px 14px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;max-width:1240px;margin-inline:auto;align-items:start}
.boardbox{position:relative;min-width:0}
.boardwrap{min-width:0;overflow:auto;max-height:calc(100dvh - 100px);border-radius:8px;background:#2b4a48;overscroll-behavior:contain}
#board.near{width:1700px;max-width:none}
.zoom{position:absolute;z-index:5;top:8px;right:8px;border:0;border-radius:6px;padding:8px 11px;background:var(--dusk);color:var(--ink);font:700 15px/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase}
#board{display:block;width:100%;max-width:calc(100dvh - 100px);min-width:0;height:auto;margin-inline:auto;background:#2b3a55;touch-action:manipulation;user-select:none}
.side{min-width:0;display:grid;gap:14px}

.plate{background:var(--dusk-2);border:1px solid var(--line);border-radius:8px;padding:14px}
.plate h2{font:700 15px/1.1 var(--f-label);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.lead{font:400 25px/1.05 var(--f-sign);text-wrap:balance}
.turn{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.dot{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid rgba(255,255,255,.75)}
.hint{color:var(--muted);font-size:15px;min-height:42px}
.hint b{color:var(--ink)}
.signpreview{display:flex;gap:12px;align-items:center;margin-top:8px}
.signpreview svg{flex:none;width:58px;height:58px}
.signpreview strong{display:block}
.signpreview small{color:var(--muted);font-size:14px;line-height:1.3;display:block}

.btn{display:block;width:100%;border:0;border-radius:8px;padding:14px 16px;background:var(--taxi);color:var(--taxi-ink);font:400 18px/1 var(--f-sign);transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{background:var(--dusk-3);color:var(--muted);cursor:not-allowed}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line);font:700 17px/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase}
.action{display:flex;gap:12px;align-items:stretch;margin-top:10px}
.action .btn{flex:1;min-width:0}
.die{flex:none;width:54px;height:54px;border-radius:9px;display:grid;place-items:center;font:400 30px/1 var(--f-sign);background:var(--dusk-3);color:var(--muted)}
.die.c-r{background:var(--stop);color:#fff}
.die.c-y{background:var(--taxi);color:var(--taxi-ink)}
.die.c-g{background:var(--go);color:#06281a}

.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font:600 13px/1 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 6px 8px}
.tbl th:first-child{text-align:left;padding-left:0}
.tbl td{padding:6px 0 6px 8px;border-top:1px solid var(--line);text-align:right;font-weight:600}
.tbl td:first-child{text-align:left;padding-left:0}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span:last-child{overflow-wrap:anywhere}
.tbl tr.now td{color:var(--taxi)}
.car{display:block;font:500 13px/1.2 var(--f-body);color:var(--muted)}

.rules{display:grid;gap:6px;font-size:15px}
.rules div{border-left:4px solid var(--kans);padding-left:9px}
.log{display:grid;gap:4px;font-size:14px;color:var(--muted);min-height:20px}

details{border-top:1px solid var(--line);padding-block:8px}
details:first-of-type{border-top:0}
summary{cursor:pointer;font:700 15px/1.2 var(--f-label);letter-spacing:.08em;text-transform:uppercase}
.legend{display:grid;gap:9px;margin-top:10px}
.legend div{display:grid;grid-template-columns:34px minmax(0,1fr);gap:9px;align-items:center;font-size:14px;line-height:1.3}
.legend svg{width:34px;height:34px}
.legend b{display:block}
.helptext{margin-top:8px;font-size:15px;color:var(--muted);display:grid;gap:6px}

.field{display:grid;gap:4px}
.field label{font:600 14px/1 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.field input,.field select{width:100%;min-width:0;background:var(--dusk);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stack{display:grid;gap:12px}
.small{font-size:14px;line-height:1.35;color:var(--muted)}
.row{display:flex;gap:8px;align-items:flex-end}
.row .field{flex:1;min-width:0}
.row .btn{width:auto;flex:none;padding:11px 14px}
.code{font:400 22px/1 var(--f-sign);color:var(--taxi);letter-spacing:.08em}

.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(14,11,38,.78);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{width:min(100%,380px);border-radius:14px;background:#fff8e6;color:#241a00;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.5);animation:deal .28s ease-out}
.card header{padding:12px 16px;font:400 15px/1 var(--f-sign);display:flex;justify-content:space-between;gap:10px;background:var(--kans);color:#2b1400}
.card.k-drink header{background:var(--stop);color:#fff}
.card.k-pax header{background:var(--tuk);color:#fff}
.card.k-info header{background:#1565c0;color:#fff}
.card.k-win header{background:var(--taxi);color:var(--taxi-ink)}
.card .body{padding:18px 16px 16px;display:grid;gap:12px}
.card h3{font:400 25px/1.08 var(--f-sign);text-wrap:balance}
.card p{font-size:17px;line-height:1.35}
.sips{display:flex;align-items:center;gap:12px;background:#ffe9b0;border-radius:8px;padding:9px 12px;font-weight:700}
.sips b{font:400 32px/1 var(--f-sign)}
.card .btn{background:#241a00;color:#ffc61e}
.card .btn[disabled]{background:#d7cdb2;color:#6a5f3f}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.picks button{border:2px solid #241a00;background:transparent;color:#241a00;border-radius:8px;padding:11px 8px;font-weight:700;overflow-wrap:anywhere}
.picks button[disabled]{opacity:.35;cursor:not-allowed}
.picks button em{font-style:normal;display:block;font-size:13px;font-weight:600}
@keyframes deal{from{transform:translateY(16px) rotate(-2deg)}to{transform:none}}

.cell{fill:transparent}
.cell.sel{fill:rgba(255,198,30,.55);stroke:var(--taxi);stroke-width:6;cursor:pointer;animation:pulse 1s infinite alternate}
.cell.rem{fill:rgba(224,48,58,.4);stroke:var(--stop);stroke-width:6;cursor:pointer}
@keyframes pulse{from{fill-opacity:.45}to{fill-opacity:1}}
.taxi{transition:transform .22s ease-in-out}
.taxi .rot{transition:transform .16s}
.t-sign{font-family:var(--f-sign)}
.t-label{font-family:var(--f-label);font-weight:700;letter-spacing:.06em}
@media (prefers-reduced-motion:reduce){.taxi,.taxi .rot,.card{transition:none;animation:none}.cell.sel{animation:none}}

.brandbtn{all:unset;cursor:pointer;display:block}
.brandbtn:focus-visible{outline:3px solid var(--taxi);outline-offset:2px}
.back{flex:none;border:1px solid var(--line);background:transparent;border-radius:6px;padding:7px 11px;font:700 15px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase}
.menu{max-width:1240px;margin-inline:auto;display:grid;gap:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:6px;padding:8px 12px;font:700 15px/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--taxi);border-color:var(--taxi);color:var(--taxi-ink)}
.search{flex:1 1 200px;min-width:0;background:var(--dusk-2);border:1px solid var(--line);border-radius:6px;padding:8px 11px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;min-width:0;background:var(--dusk-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;text-align:left;padding:0;color:inherit}
button.tile:hover{border-color:var(--taxi)}
.tile .art{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:var(--dusk-3);font:400 64px/1 var(--f-sign);color:var(--muted)}
.tile .art svg{display:block;width:100%;height:100%}
.tile .info{padding:12px 14px 14px;display:grid;gap:6px;flex:1;align-content:start}
.tile h2{font:400 20px/1.1 var(--f-sign)}
.tile p{font-size:15px;color:var(--muted);line-height:1.3}
.tile .meta{display:flex;justify-content:space-between;gap:8px;font:600 14px/1.1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tile .play{color:var(--taxi)}
.tile.soon .art,.tile.soon h2{opacity:.6}
.empty{color:var(--muted)}
.fmain{min-width:0;position:relative}
#fcv,#fgl{display:block;width:100%;height:auto;border-radius:8px}
#fgl{aspect-ratio:16/9;background:#2b2a5a}
#fgl:not([hidden])+#fcv{position:absolute;inset:0;height:100%;pointer-events:none}
.qr{background:#fff;border-radius:8px;padding:8px;width:min(100%,220px);margin-inline:auto}
.qr svg{display:block;width:100%;height:auto}
.url{overflow-wrap:anywhere;text-align:center}
.linkbtn{display:block;text-align:center;border-radius:8px;padding:12px;background:var(--taxi);color:var(--taxi-ink);font-weight:700;text-decoration:none}
.zat{display:block;height:6px;width:100%;min-width:70px;background:var(--dusk);border-radius:3px;overflow:hidden;margin-top:3px}
.zat i{display:block;height:100%;background:linear-gradient(90deg,#8ed13f,#ffc61e,#e0303a)}
#stuur{position:fixed;inset:0;z-index:40;background:var(--dusk);overflow:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.st{display:grid;gap:12px;padding:32px 20px;max-width:420px;margin-inline:auto}
.st input{width:100%;background:var(--dusk-2);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:18px;user-select:text;-webkit-user-select:text}
.st label{font:600 14px/1 var(--f-label);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stlogo{font:400 30px/1.05 var(--f-sign);color:var(--taxi)}
.stline{font-size:18px}
.stplay{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px;padding:max(14px,env(safe-area-inset-top,0px)) 14px max(14px,env(safe-area-inset-bottom,0px))}
.stname{font:400 20px/1.1 var(--f-sign);color:var(--me)}
.stmsg{min-height:64px;display:grid;align-content:center;gap:2px;text-align:center;border-radius:8px;background:var(--dusk-2);padding:8px}
.stmsg b{font-size:18px}.stmsg span{font-size:15px;color:var(--muted)}
.stmsg.bad{background:var(--stop)}.stmsg.bad span{color:#fff;font-weight:700;font-size:20px}
#stwheel{width:100%;height:100%;min-height:0}
.stbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tilt .stbtns{display:none}
.stbtns button{border:0;border-radius:10px;height:96px;background:var(--dusk-3);color:var(--ink);font:700 19px/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase;touch-action:none}
.stturn{display:none;text-align:center;font-weight:700;color:var(--taxi)}
@media (orientation:portrait){.stturn{display:block}}
@media (orientation:landscape){
  .stplay{grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"l name r" "l msg r" "l wheel r" "l wheel r";gap:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px}
  .stname{grid-area:name;text-align:center;font-size:15px}
  .stmsg{grid-area:msg;min-height:44px;padding:4px}
  .stmsg b{font-size:15px}.stmsg span{font-size:13px}
  #stwheel{grid-area:wheel}
  .stbtns{display:contents}
  .stbtns button{height:auto;min-height:0}
  #stl{grid-area:l}#str{grid-area:r}
  .tilt .stbtns{display:none}
}
.stbtns .on{outline:4px solid var(--ink)}
.busmain{min-width:0;display:grid;gap:14px}
#busscene{display:block;width:100%;height:auto;border-radius:8px;background:#3a2f7a}
.busgo{transition:transform .7s ease-in-out}
.stagehead{font:700 16px/1.1 var(--f-label);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.tkrow{display:flex;flex-wrap:wrap;gap:10px}
.tk{--t:#6f6c84;width:96px;height:132px;max-width:100%;background:#fff8e6;color:#241a00;border-radius:8px;border-top:16px solid var(--t);display:grid;grid-template-rows:auto 1fr auto;justify-items:center;padding:5px 4px;position:relative}
.tk::before,.tk::after{content:"";position:absolute;top:52%;width:12px;height:12px;border-radius:50%;background:var(--dusk)}
.tk::before{left:-6px}.tk::after{right:-6px}
.tk span{font:600 12px/1 var(--f-label);letter-spacing:.09em;text-transform:uppercase}
.tk b{font:400 42px/1.1 var(--f-sign);align-self:center;color:var(--t)}
.tk em{font:700 13px/1 var(--f-label);font-style:normal;letter-spacing:.06em;text-transform:uppercase}
.tk.c0{--t:#d3202a}.tk.c1{--t:#d96a00}.tk.c2{--t:#1565c0}.tk.c3{--t:#158a52}
.tk.back{background:var(--dusk-3);color:var(--muted);--t:var(--tuk)}
.pyr{display:grid;gap:6px;justify-items:center}
.pyrow{display:flex;gap:6px;align-items:center;position:relative;min-width:0;max-width:100%}
.pyrow i{position:absolute;left:-22px;font:400 15px/1 var(--f-sign);font-style:normal;color:var(--taxi)}
.pyr .tk{width:62px;height:84px;border-top-width:9px;padding:3px 2px}
.pyr .tk b{font-size:24px}.pyr .tk span,.pyr .tk em{font-size:10px}
.pyr .tk::before,.pyr .tk::after{display:none}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.answers .btn{padding-inline:6px;font-size:16px}
@media (max-width:440px){.pyr .tk{width:52px;height:72px}.pyr .tk b{font-size:20px}.pyrow i{display:none}}
@media (prefers-reduced-motion:reduce){.busgo{transition:none}}
.trackwrap{min-width:0}
#track{display:block;width:100%;height:auto;border-radius:8px;background:#2f8f52}
.rh{transition:transform .45s ease-in-out}
.running .hs{animation:bob .17s infinite alternate}
.leg{transform-box:fill-box;transform-origin:50% 0}
.running .leg.a{animation:kick .17s infinite alternate}
.running .leg.b{animation:kick .17s infinite alternate-reverse}
@keyframes kick{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-7px)}}
.betrow{display:grid;grid-template-columns:minmax(0,1fr) auto 54px;gap:6px;align-items:center}
.betrow input,.betrow select{width:100%;min-width:0;background:var(--dusk);border:1px solid var(--line);border-radius:6px;padding:8px}
.horsepick{display:flex;gap:3px}
.horsepick button{border:2px solid transparent;background:transparent;border-radius:50%;padding:0;width:32px;height:32px;opacity:.45}
.horsepick button[aria-pressed="true"]{border-color:var(--ink);opacity:1}
.horsepick svg{display:block;width:100%;height:100%}
.legendh{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:14px;color:var(--muted)}
.legendh span{display:flex;align-items:center;gap:6px}
.legendh svg{width:18px;height:18px;flex:none}
.callout{font:400 19px/1.2 var(--f-sign);min-height:70px}
.autobtn{flex:0 0 42%}
@media (prefers-reduced-motion:reduce){.rh{transition:none}.running .hs,.running .leg.a,.running .leg.b{animation:none}}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:14px}
  #board{max-width:min(100%,640px)}
  .boardwrap{max-height:62dvh}
  #board.near{width:1250px}
  .tag{display:none}
  .lead{font-size:22px}
  .hint{min-height:0}
}
</style>

<div class="top">
  <button class="brandbtn" id="home"><h1 class="brand" id="brand">Spel<span>café</span></h1></button>
  <button class="back" id="back" hidden>Alle spellen</button>
  <div class="tag" id="tag">Kies een spel en schenk in</div>
</div>
<div class="checker" aria-hidden="true"></div>

<section class="menu" id="menu" aria-label="Spellen">
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Zoek een spel" aria-label="Zoek een spel">
    <div class="tools" id="chips"></div>
  </div>
  <div class="tiles" id="tiles"></div>
  <p class="empty" id="empty" hidden>Geen spel gevonden. Probeer een andere zoekterm.</p>
</section>

<div id="race" hidden>
  <div class="app">
    <div class="trackwrap"><svg id="track" viewBox="0 0 1000 620" role="img" aria-label="Renbaan met vier paarden en zeven hindernissen"></svg></div>
    <div class="side" id="raceside"></div>
  </div>
  <div id="rmodal"></div>
</div>

<div id="bus" hidden>
  <div class="app">
    <div class="busmain"><svg id="busscene" viewBox="0 0 1000 300" role="img" aria-label="Bus op de lijn van Sint-Pieters naar de Overpoort"></svg><div id="busstage"></div></div>
    <div class="side" id="busside"></div>
  </div>
  <div id="bmodal"></div>
</div>

<div id="fiets" hidden>
  <div class="app">
    <div class="fmain"><canvas id="fgl" width="960" height="540" hidden></canvas><canvas id="fcv" width="960" height="540" aria-label="Fietsrit van de Overpoort naar Bar des Amis"></canvas></div>
    <div class="side" id="fside"></div>
  </div>
</div>
<div id="stuur" hidden></div>

<div id="game" hidden>
  <div class="app">
    <div class="boardbox"><button class="zoom" id="zoom">Hele kaart</button><div class="boardwrap" id="wrap"><svg id="board" class="near" viewBox="-420 -420 2140 2140" role="img" aria-label="Spelkaart van Gent met straten, verkeerslichten en bekende plekken"></svg></div></div>
    <div class="side" id="side"></div>
  </div>
  <div id="modal"></div>

<script>

function newGame(names,strength,length){
  const n=names.length, target=length==='kort'?Math.min(n,2):Math.min(Math.max(n,2),3);
  let deck=[];

  for(let i=0;i<KANS_IN_DECK;i++)deck.push('K');

function say(k,t,x,who,n){
  const m={k,t,x};
  if(who&&n){who.forEach(p=>G.P[p].sips+=n);m.who=who;m.n=n}
  G.q.push(m);
}
function ask(k,t,x,mode,n){G.q.push({k,t,x,mode,n})}
function flow(a){G.after=a;if(!G.modal&&G.q.length)G.modal=G.q.shift();else if(!G.modal)run(a)}
function okModal(){G.modal=null;if(G.q.length)G.modal=G.q.shift();else run(G.after)}
function run(a){
  if(G.over&&G.phase!=='over')return endGame();
  if(a==='draw')G.phase='draw';
  else if(a==='roll')G.phase='roll';
  else if(a==='resume')G.phase='move';
  else if(a==='next')nextTurn();
}
function occupied(c){return G.P.some((p,i)=>i!==G.cur&&p.pos===c)&&c!==P().home}

function startTurn(){
  G.rules=G.rules.filter(r=>r.o!==G.cur);
  G.green=0;G.bonus=0;G.drawn='';G.roll=0;G.left=0;G.taken=0;G.prev=-1;G.path=[];G.nsu=0;

  if(p.pax>=0){const t=PAX[G.pax[p.pax].i];if(t.each)say('pax',t.n+' zit nog in de tuk-tuk','Dat kost je elke beurt iets.',[G.cur],sips(t.each))}

}
function nextTurn(){
  if(G.over||G.di>=G.deck.length)return endGame();
  G.cur=(G.cur+1)%G.n;G.turn++;startTurn();
}
function checkEnd(){
  const left=G.pax.filter(x=>x.s<2).length, top=Math.max(...G.P.map(p=>p.done));
  if(top>=G.target||left===0)G.over=1;

function ranking(){return G.P.map((p,i)=>({...p,i})).sort((a,b)=>b.done-a.done||a.last-b.last||a.sips-b.sips)}

/* ---------- stapel ---------- */
function connectedWithout(block){
  const start=STOPS[0];if(block.has(start))return false;
  const seen=new Set([start]),q=[start];
  for(const u of q)for(const v of ADJ[u])if(!seen.has(v)&&!block.has(v)){seen.add(v);q.push(v)}
  return seen.size===NODES.length-block.size;
}
function validCells(code){
  const stops=STOPS.slice(0,G.n), wait=G.pax.filter(x=>x.s===0).map(x=>x.c);
  const walls=Object.keys(G.signs).filter(k=>G.signs[k]==='X').map(Number);
  return ROADS.filter(c=>{
    if(LIGHTS.includes(c)||stops.includes(c)||GARAGE.includes(c)||FUEL.includes(c)||KANS.includes(c)||wait.includes(c))return false;
    if(G.P.some(p=>p.pos===c))return false;
    const jn=JUNCTIONS.includes(c);
    if(code==='L'||code==='R')return jn;
    if(code==='X'){
      if(jn||nbrs(c).some(a=>stops.includes(a)))return false;
      return connectedWithout(new Set([...walls.filter(k=>k!==c),c]));
    }
    return true;
  });
}
function draw(){
  const t=G.deck[G.di++];G.drawn=t;
  if(t==='K')return drawKans('roll');
  if(t==='M'||t==='T'){
    const set=t==='M'?GARAGE:FUEL, free=set.filter(c=>!occupied(c)).sort((a,b)=>dist(a,P().pos)-dist(b,P().pos));
    if(free.length)P().pos=free[0];
    if(t==='M'){P().skip=1;say('drink','Getakeld',nm(G.cur)+' stond fout geparkeerd aan de Dampoort en haalt de tuk-tuk op in het depot. Volgende beurt overslaan.',[G.cur],sips(2))}
    else say('drink','Nachtwinkel','Een blikje voor onderweg, drie euro voor iets dat in de winkel één euro kost. '+nm(G.cur)+' stopt hier.',[G.cur],sips(3));
    return flow('next');
  }
  if(t==='D'){
    if(!Object.keys(G.signs).length){note('Bord weg: geen borden op straat.');G.phase='roll';return}
    G.phase='remove';return;
  }
  if(!validCells(t).length){G.phase='roll';return}
  G.phase='place';
}
function place(c){G.signs[c]=G.drawn;note(nm(G.cur)+' legt '+(SIGNS[G.drawn]||ACTIONS[G.drawn]).n+'.');G.phase='roll'}
function removeSign(c){const s=G.signs[c];delete G.signs[c];note(nm(G.cur)+' haalt '+(SIGNS[s]||ACTIONS[s]).n+' weg.');G.phase='roll'}

function drawKans(after){
  const card=CARDS[G.kans[G.ki++%G.kans.length]], [t,title,raw,base=0]=card;
  const n=base?sips(base):0, x=raw.replaceAll('{cur}',nm(G.cur)).replaceAll('{n}',n);
  const k='kans',cur=G.cur;
  if(t==='me')say(k,title,x,[cur],n);
  else if(t==='all')say(k,title,x,everyone(),n);
  else if(t==='others')say(k,title,x,others(),n);
  else if(t==='water')say(k,title,x);
  else if(t==='give')ask(k,title,x,'give',n);
  else if(t==='loser')ask(k,title,x,'loser',n);
  else if(t==='talk')say(k,title,x);
  else if(t==='rule'){say(k,title,x);G.rules.push({t:title+': '+x,o:cur})}
  else if(t==='boost'){G.bonus=3;say(k,title,x)}
  else if(t==='green'){G.green=1;say(k,title,x)}
  else if(t==='skip'){P().skip=1;say(k,title,x,[cur],n)}
  else if(t==='swap')ask(k,title,x,'swap',1);
  else if(t==='steal'){
    if(P().pax<0&&others().some(i=>G.P[i].pax>=0))ask(k,title,x,'steal',1);
    else say(k,title,x,[cur],sips(2));
  }
  else if(t==='home'){P().pos=P().home;say(k,title,x,[cur],n)}
  flow(after);
}
function pick(p){
  const m=G.modal;
  if(m.mode==='give'||m.mode==='loser'){
    G.P[p].sips+=1;m.given=m.given||{};m.given[p]=(m.given[p]||0)+1;m.n--;
    if(m.mode==='loser'&&m.n>0)return pick(p);
    if(m.n<=0){const g=m.given;note(Object.keys(g).map(i=>nm(+i)+' +'+g[i]).join(', '));okModal()}
    return;
  }
  if(m.mode==='swap'){const a=P(),b=G.P[p];[a.pos,b.pos]=[b.pos,a.pos];note(nm(G.cur)+' wisselt met '+nm(p)+'.');return okModal()}
  if(m.mode==='steal'){
    const b=G.P[p];P().pax=b.pax;G.pax[b.pax].o=G.cur;b.pax=-1;note(nm(G.cur)+' kaapt de passagier van '+nm(p)+'.');return okModal()
  }
}

/* ---------- rijden ---------- */
const lightColor=r=>r<=2?'r':(r===4||r===6)?'y':'g';
function doRoll(){
  const r=1+Math.floor(Math.random()*6), p=P();
  const speed=p.pax>=0?(PAX[G.pax[p.pax].i].speed||0):0;
  G.roll=r;G.left=Math.max(1,r+2+speed+G.bonus);G.bonus=0;G.taken=0;G.prev=-1;G.path=[];G.phase='move';
}
function opts(){
  const p=P(),here=G.signs[p.pos];
  let o=nbrs(p.pos).filter(c=>c!==G.prev&&G.signs[c]!=='X');
  if((here==='L'||here==='R')&&G.prev>=0){
    const a=NODES[G.prev],b=NODES[p.pos];
    const score=c=>{const d=NODES[c],cr=(b.x-a.x)*(d.y-b.y)-(b.y-a.y)*(d.x-b.x);return here==='R'?cr:-cr};
    const best=o.slice().sort((x,y)=>score(y)-score(x))[0];
    if(best!==undefined&&score(best)>0)o=[best];
  }
  return o;
}
function stopBefore(msg,drink){
  G.left=0;
  if(drink)say('drink',msg[0],msg[1],[G.cur],sips(drink));else note(msg[1]);
  finish();
}
function stepTo(c){
  const p=P();
  if(LIGHTS.includes(c)&&!G.green){
    const col=lightColor(G.roll);
    if(col==='r')return stopBefore(['Rood licht',nm(G.cur)+' gooide '+G.roll+' en staat te wachten aan de lichten.'],1);
    if(col==='y'){
      const allowed=Math.floor(G.roll/2);
      if(G.taken+2>allowed||G.left<2)return stopBefore(['','Oranje licht: '+nm(G.cur)+' haalt het kruispunt niet.']);
      G.left=Math.min(G.left,allowed-G.taken);
    }else if(G.left<2)return stopBefore(['','Te weinig stappen om het kruispunt over te steken.']);
  }
  const s=G.signs[c];
  if((s==='S'||s==='Z')&&G.taken>0)return stopBefore(['',nm(G.cur)+' stopt voor '+SIGNS[s].n+'.']);
  if(G.left===1&&occupied(c))return stopBefore(['','Vak bezet: '+nm(G.cur)+' blijft staan.']);
  G.prev=p.pos;p.pos=c;G.path.push(G.prev);G.left--;G.taken++;
  if(s==='G'||s==='W'){G.left=Math.max(0,G.left-1);note(SIGNS[s].n+': 1 stap minder.')}
  if(s==='4')G.left=Math.min(G.left,Math.max(0,4-G.taken));
  if(s==='P'&&G.roll>=5){
    G.left=0;p.pos=p.home;
    if(p.pax>=0){const x=G.pax[p.pax];x.s=0;x.o=-1;p.pax=-1}
    G.prev=-1;G.path=[];
    say('drink','Betrapt door de politie','Te snel met een '+G.roll+'. '+nm(G.cur)+' moet terug naar het kot en een eventuele passagier stapt uit.',[G.cur],sips(3));
    return flow('next');
  }
  const w=G.pax.findIndex(x=>x.s===0&&x.c===c);
  if(p.pax<0&&w>=0&&!occupied(c)){
    const x=G.pax[w],t=PAX[x.i];x.s=1;x.o=G.cur;p.pax=w;G.left=0;
    say('pax',t.n+' stapt in aan '+x.l,t.x,t.pick?[G.cur]:null,t.pick?sips(t.pick):0);
    return flow('next');
  }
  if(c===p.home&&p.pax>=0){
    const x=G.pax[p.pax],t=PAX[x.i];x.s=2;x.o=-1;p.pax=-1;p.done++;p.last=G.turn;G.left=0;
    if(t.all)say('pax',t.n+' is er','Iedereen klinkt op de rit van '+nm(G.cur)+'.',everyone(),sips(t.all));
    if(t.give)ask('pax',t.n+' is er',nm(G.cur)+' krijgt fooi en deelt '+sips(t.give)+' slokken uit.','give',sips(t.give));
    checkEnd();
    return flow('next');
  }
  if(G.left<=0)return finish();
  if(!opts().length){G.left=0;finish()}
}
function finish(){
  const p=P();
  G.left=0;
  while(occupied(p.pos)&&G.path.length)p.pos=G.path.pop();
  if(!G.taken)return flow('next');
  const s=G.signs[p.pos];
  if(s==='N'&&!G.nsu){
    G.nsu=1;G.left=5;
    say('info','Stilstaan verboden',nm(G.cur)+' moet meteen 5 stappen doorrijden.');
    return flow('resume');
  }
  if(s==='B'){say('info','Parkeerverbod',nm(G.cur)+' mag hier niet blijven staan en gooit opnieuw.');return flow('roll')}
  if(KANS.includes(p.pos))return drawKans('next');
  flow('next');
}

/* ---------- bediening ---------- */
const canAct=()=>G&&G.phase!=='over'&&(mySeat<0||mySeat===G.cur);
function act(fn){if(!canAct())return;G.by=ME;fn();commit()}
function commit(){G.v++;save();render();send();drive()}
function drive(){
  clearTimeout(autoTimer);
  if(!G||G.modal||G.phase!=='move'||G.by!==ME)return;
  const o=opts();
  if(o.length===1)autoTimer=setTimeout(()=>act(()=>stepTo(o[0])),DELAY);
  else if(!o.length)autoTimer=setTimeout(()=>act(()=>{G.left=0;finish()}),DELAY);
}
function rollClick(){
  if(!canAct()||rolling)return;
  rolling=1;render();
  setTimeout(()=>{rolling=0;act(doRoll)},ROLLTIME);
}
function save(){try{localStorage.setItem('zatte-tuktuk-gent3',JSON.stringify(G))}catch(e){}}
function load(){try{const s=localStorage.getItem('zatte-tuktuk-gent3');return s?JSON.parse(s):null}catch(e){return null}}

/* ---------- online tafel ---------- */
function wire(){return JSON.stringify({...G,log:[]})}
function send(){if(room)room.emit('stand',JSON.parse(wire())).catch(()=>{})}
async function joinRoom(code){
  room=await roomCap.join('tt-'+code);roomCode=code;
  room.on('stand',m=>{
    if(m.sameTab||!m.data||!Array.isArray(m.data.P))return;
    if(G&&m.data.id===G.id&&m.data.v<=G.v)return;
    const log=G?G.log:[];G=m.data;G.log=log;clearTimeout(autoTimer);render();
  });
  room.on('vraag',m=>{if(!m.sameTab&&G)send()});
  room.onPeers(c=>{peersN=c.peers.length;if(c.joined.some(p=>!p.isMe)&&G)send();render()});
  room.emit('vraag',{}).catch(()=>{});
}

function staticBoard(){
  const road=STREETS.map(([a,b,cx,cy])=>`M${J[a][0]} ${J[a][1]}Q${cx} ${cy} ${J[b][0]} ${J[b][1]}`).join('');
  let h=`<defs>${signSym()}</defs><rect x="${VX}" y="${VY}" width="${VS}" height="${VS}" fill="#2b4a48"/>`;
  /* stadsgrond met losse wijken */
  h+=`<path d="M-260 300C-260 -160 300 -280 760 -200S1500 -90 1540 380 1560 1320 900 1470 -40 1520 -220 1200 -260 700 -260 300Z" fill="#2e3b58"/>`;
  [[-300,-300,90],[1650,300,110],[1640,1500,120],[-330,1620,70],[300,1640,80],[1300,-340,80]].forEach(([x,y,z])=>{for(let i=0;i<5;i++)h+=`<circle cx="${x+Math.cos(i*2.1)*z}" cy="${y+Math.sin(i*2.1)*z}" r="${z*.42}" fill="#35705a"/>`});
  /* Leie en Schelde */
  h+=`<g fill="none" stroke="#2f6f96" stroke-linecap="round"><path d="M-420 1450C-120 1150 250 800 290 640S300 330 330 230 560 70 760 95 1120 60 1720 40" stroke-width="44"/><path d="M1720 1420C1300 1120 1090 960 1085 780S1040 420 920 250 860 120 760 95" stroke-width="36"/><path d="M230 690C150 520 130 300 60 -20S-60 -300 -160 -420" stroke-width="22"/><path d="M930 100L985 -420" stroke-width="58"/></g><ellipse cx="-110" cy="1000" rx="0" ry="0"/>`;
  /* straten */
  h+=`<path d="${road}" fill="none" stroke="#17152f" stroke-width="68" stroke-linecap="round"/><path d="${road}" fill="none" stroke="#3f3c58" stroke-width="58" stroke-linecap="round"/><path d="${road}" fill="none" stroke="#e8e2ff" stroke-width="3" stroke-dasharray="12 14" opacity=".35"/>`;
  SCENE.forEach(([k,x,y,s,n])=>{
    h+=`<g transform="translate(${x} ${y}) scale(${s})">${DRAW[k]()}</g>`;
  });
  ROADS.forEach(i=>{h+=`<circle cx="${X(i)}" cy="${Y(i)}" r="9" fill="#e8e2ff" opacity=".7"/>`});
  KANS.forEach(i=>{h+=`<rect x="${X(i)-27}" y="${Y(i)-27}" width="54" height="54" rx="9" fill="#ff8a1f"/><text x="${X(i)}" y="${Y(i)+20}" text-anchor="middle" class="t-sign" font-size="44" fill="#2b1400">?</text>`});
  GARAGE.forEach(i=>{h+=`<use href="#s-M" x="${X(i)-27}" y="${Y(i)-27}" width="54" height="54"/>`});
  FUEL.forEach(i=>{h+=`<use href="#s-T" x="${X(i)-27}" y="${Y(i)-27}" width="54" height="54"/>`});
  LIGHTS.forEach(i=>{const x=X(i),y=Y(i);h+=`<circle cx="${x}" cy="${y}" r="34" fill="#23213a"/><rect x="${x-14}" y="${y-30}" width="28" height="60" rx="8" fill="#0d0c1c"/><circle cx="${x}" cy="${y-17}" r="7.5" fill="#e0303a"/><circle cx="${x}" cy="${y}" r="7.5" fill="#ffc61e"/><circle cx="${x}" cy="${y+17}" r="7.5" fill="#2fb673"/>`});
  SCENE.forEach(([k,x,y,s,n,dy=6])=>{
    const w=n.length*14.5+22,lx=x,ly=y+dy;
    h+=`<g><rect x="${lx-w/2}" y="${ly}" width="${w}" height="32" rx="6" fill="#141130" opacity=".92"/><text x="${lx}" y="${ly+24}" text-anchor="middle" class="t-label" font-size="27" fill="#ffc61e">${n}</text></g>`;
  });
  h+=`<g id="stops"></g><g id="signs"></g><g id="pax"></g><g id="cells">`;
  ROADS.forEach(i=>{h+=`<circle class="cell" data-c="${i}" cx="${X(i)}" cy="${Y(i)}" r="30"/>`});
  h+=`</g><g id="taxis"></g>`;
  return h;
}
function taxiSvg(col,i){
  return `<g class="taxi" id="tx${i}"><g class="rot" id="txr${i}"><g transform="scale(.74)">
   <rect x="-34" y="-25" width="68" height="50" rx="20" fill="#14122c"/>
   <rect x="-30" y="-21" width="60" height="42" rx="17" fill="${col}"/>
   <rect x="-16" y="-16" width="26" height="32" rx="7" fill="#14122c" opacity=".75"/>
   <rect x="16" y="-15" width="9" height="30" rx="3" fill="#cfe7ff"/>
   <circle id="txp${i}" cx="-3" cy="0" r="9" fill="#fff" stroke="#14122c" stroke-width="3" visibility="hidden"/>
  </g></g></g>`;
}

const ang={},lastPos={};
const nearAny=(x,y)=>ROADS.slice().sort((a,b)=>Math.hypot(X(a)-x,Y(a)-y)-Math.hypot(X(b)-x,Y(b)-y))[0];
const SAMPLE={P:[{pos:nearAny(340,520),home:STOPS[0],pax:-1,nm:''},{pos:nearAny(700,560),home:STOPS[1],pax:0,nm:''},{pos:nearAny(690,1030),home:STOPS[2],pax:-1,nm:''}],
  n:3,signs:{[nearAny(850,500)]:'S',[nearAny(520,725)]:'4',[nearAny(180,300)]:'G',[nearAny(860,920)]:'B'},
  pax:[LANDMARKS[9],LANDMARKS[0],LANDMARKS[10],LANDMARKS[8]].map((l,i)=>({c:l.c,s:0,i}))};

function renderBoard(){
  const g=G||SAMPLE;
  board.querySelector('#stops').innerHTML=g.P.map((p,i)=>{const x=X(p.home),y=Y(p.home);
    return `<path d="M${x-34} ${y+26}v-30l34 -26 34 26v30z" fill="#14122c" stroke="${COLORS[i]}" stroke-width="7" stroke-linejoin="round"/><text x="${x}" y="${y+17}" text-anchor="middle" class="t-label" font-size="24" fill="${COLORS[i]}">KOT</text>`}).join('');
  board.querySelector('#signs').innerHTML=Object.entries(g.signs).map(([c,s])=>`<use href="#s-${s}" x="${X(+c)-30}" y="${Y(+c)-30}" width="60" height="60"/>`).join('');
  board.querySelector('#pax').innerHTML=g.pax.filter(x=>x.s===0).map(x=>{const cx=X(x.c),cy=Y(x.c);
    return `<g><title>${esc(PAX[x.i].n)}</title><circle cx="${cx}" cy="${cy}" r="27" fill="#14122c" fill-opacity=".55" stroke="#fff" stroke-width="5" stroke-dasharray="8 7"/><circle cx="${cx}" cy="${cy-12}" r="9" fill="#fff"/><path d="M${cx-12} ${cy+15}c0-22 24-22 24 0z" fill="#fff"/></g>`}).join('');
  const sel=new Set(),rem=new Set();
  if(G&&canAct()&&!G.modal&&!rolling){
    if(G.phase==='place')validCells(G.drawn).forEach(c=>sel.add(c));
    if(G.phase==='remove')Object.keys(G.signs).forEach(c=>rem.add(+c));
    if(G.phase==='move'&&G.by===ME&&opts().length>1)opts().forEach(c=>sel.add(c));
  }
  board.querySelectorAll('.cell').forEach(el=>{const c=+el.dataset.c;el.classList.toggle('sel',sel.has(c));el.classList.toggle('rem',rem.has(c))});
  const lay=board.querySelector('#taxis');
  if(lay.childElementCount!==g.P.length){lay.innerHTML=g.P.map((p,i)=>taxiSvg(COLORS[i],i)).join('');for(const k in lastPos)delete lastPos[k]}
  const spot={};
  g.P.forEach((p,i)=>{
    const lp=lastPos[i];
    if(lp!==undefined&&lp!==p.pos&&dist(lp,p.pos)===1){
      const t=Math.atan2(Y(p.pos)-Y(lp),X(p.pos)-X(lp))*180/Math.PI,cur=ang[i]||0,d=((t-cur+540)%360)-180;ang[i]=cur+d;
    }
    lastPos[i]=p.pos;
    const k=spot[p.pos]=(spot[p.pos]||0)+1, off=(k-1)*14;
    document.getElementById('tx'+i).style.transform=`translate(${X(p.pos)+off}px,${Y(p.pos)+off}px)`;
    document.getElementById('txr'+i).style.transform=`rotate(${ang[i]||0}deg)`;
    document.getElementById('txp'+i).setAttribute('visibility',p.pax>=0?'visible':'hidden');
  });
  lay.appendChild(document.getElementById('tx'+(G?G.cur:0)));
  const key=G?G.cur+':'+G.P[G.cur].pos:'';
  if(G&&key!==lastFocus&&G.phase!=='place'&&G.phase!=='remove'){lastFocus=key;focusOn(G.P[G.cur].pos)}
}
let zoom='near',lastFocus='';
const wrapEl=document.getElementById('wrap');
function focusOn(i,instant){
  if(zoom!=='near'||!wrapEl.clientWidth)return;
  const k=board.clientWidth/VS, calm=instant||matchMedia('(prefers-reduced-motion:reduce)').matches;
  wrapEl.scrollTo({left:(X(i)-VX)*k-wrapEl.clientWidth/2,top:(Y(i)-VY)*k-wrapEl.clientHeight/2,behavior:calm?'auto':'smooth'});
}
function setZoom(z){
  zoom=z;board.classList.toggle('near',z==='near');
  document.getElementById('zoom').textContent=z==='near'?'Hele kaart':'Inzoomen';
  if(z==='near')focusOn(G?G.P[G.cur].pos:nid.ku,true);
}
document.getElementById('zoom').addEventListener('click',()=>setZoom(zoom==='near'?'fit':'near'));
board.addEventListener('click',e=>{
  const el=e.target.closest('.cell');if(!el||!G)return;const c=+el.dataset.c;
  if(el.classList.contains('sel')){
    if(G.phase==='place')act(()=>place(c));
    else if(G.phase==='move')act(()=>stepTo(c));
  }else if(el.classList.contains('rem'))act(()=>removeSign(c));
});

const side=document.getElementById('side'),modalEl=document.getElementById('modal');
const icon=k=>`<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#s-${k}"/></svg>`;
function legend(){
  const row=(k,v)=>`<div>${icon(k)}<span><b>${v.n}</b>${v.d}</span></div>`;
  return `<details><summary>Verkeersborden</summary><div class="legend">${Object.entries(SIGNS).map(([k,v])=>row(k,v)).join('')}${Object.entries(ACTIONS).map(([k,v])=>row(k,v)).join('')}</div></details>
  <details><summary>Spelregels</summary><div class="helptext">
   <p>Elke beurt trek je uit de stapel: een bord leg je op straat, een actie voer je uit, een kanskaart lees je voor. Daarna gooi je en rij je je worp plus 2 stappen, want de stad is groot.</p>
   <p>Passagiers wachten aan de plekken in de stad. Rij naar een stippelcirkel om er een op te halen en breng die naar je eigen kot. Keren in dezelfde beurt mag niet.</p>
   <p>Bij verkeerslichten telt de kleur van de dobbelsteen. 1 of 2 is rood: stoppen en 1 slok. 4 of 6 is oranje: halve worp. 3 of 5 is groen: doorrijden.</p>
   <p>Sleep over de kaart om rond te kijken of tik op Hele kaart. Elke stip op de weg is een stap. Eindig je op een oranje vraagteken, dan trek je een kanskaart.</p>
   <p>Wie eerst het aantal uit de stand afzet, wint. De stapel leeg? Dan wint wie de meeste passagiers afzette.</p>
  </div></details>`;
}

    ${saved?`<button class="btn" id="resume">Verder met de vorige rit</button>`:''}
    <div class="stack">
      <div class="field"><label for="count">Spelers</label><select id="count">${[2,3,4,5,6].map(n=>`<option ${n===names.length?'selected':''}>${n}</option>`).join('')}</select></div>
      <div class="names">${names.map((s,i)=>`<div class="field"><label for="pn${i}">Tuk-tuk ${COLORNAMES[i]}</label><input id="pn${i}" maxlength="14" value="${esc(s)}"></div>`).join('')}</div>
      <div class="grid2">
        <div class="field"><label for="str">Dorst</label><select id="str"><option value="0">Rustig</option><option value="1" selected>Normaal</option><option value="2">Stevig</option></select></div>
        <div class="field"><label for="len">Lengte</label><select id="len"><option value="kort">Korte rit</option><option value="lang" selected>Lange rit</option></select></div>
      </div>
      <button class="btn" id="start">Start de rit</button>
      <p class="small">Voor 18+. Geen alcohol? Water of frisdrank telt net zo goed. Sla gerust een slok over: niemand hoeft mee te doen.</p>
    </div>
  </div>
  ${roomCap?`<div class="plate stack"><h2>Elk op een eigen scherm</h2>
    <button class="btn alt" id="host">Online tafel openen</button>
    <div class="row"><div class="field"><label for="code">Code van een tafel</label><input id="code" maxlength="4" autocomplete="off"></div><button class="btn alt" id="join">Aansluiten</button></div>
    <p class="small" id="roomerr">Vrienden hebben toegang tot deze pagina nodig als bijdrager en moeten aangemeld zijn.</p></div>`:''}
  <div class="plate">${legend()}</div>`;
}
let setupNames=['Jef','Marie','Rik'];
function readNames(){return setupNames.map((s,i)=>{const e=document.getElementById('pn'+i);return e?(e.value.trim()||('Speler '+(i+1))):s})}
const DEF=['Jef','Marie','Rik','Lien','Wout','Sofie'];
function setupEvents(){
  const on=(i,f,ev='click')=>{const e=document.getElementById(i);if(e)e.addEventListener(ev,f)};
  on('count',e=>{const cur=readNames(),n=+e.target.value;setupNames=Array.from({length:n},(_,i)=>cur[i]||DEF[i]);render()},'change');
  const begin=()=>{const s=document.getElementById('str').value,l=document.getElementById('len').value;setupNames=readNames();newGame(setupNames,+s,l)};
  on('start',()=>{begin();commit()});
  on('resume',()=>{G=load();render();drive()});
  on('host',async()=>{
    try{const code=Math.random().toString(36).slice(2,6);begin();await joinRoom(code);commit()}
    catch(e){G=null;room=null;document.getElementById('roomerr').textContent='De online tafel ging niet open. Speel op één scherm of probeer het later opnieuw.';render()}
  });
  on('join',async()=>{
    const v=document.getElementById('code').value.trim().toLowerCase();
    if(!/^[a-z0-9]{4}$/.test(v)){document.getElementById('roomerr').textContent='Een code telt 4 letters of cijfers.';return}
    try{await joinRoom(v);document.getElementById('roomerr').textContent='Verbonden. Wacht op de stand van tafel '+v+'.'}
    catch(e){document.getElementById('roomerr').textContent='Aansluiten lukte niet. Controleer de code en je toegang tot deze pagina.'}
  });
}
function phaseView(){
  const p=P(),who=esc(p.nm),mine=canAct();
  const wait=`<p class="hint">Wacht op ${who}.</p>`;
  let body='',btn='';
  const die=`<div class="die ${G.roll&&!rolling?'c-'+lightColor(G.roll):''}" aria-label="Dobbelsteen">${rolling?'?':(G.roll||'-')}</div>`;
  if(G.phase==='draw'){body=`<p class="hint">Trek uit de stapel. Nog ${G.deck.length-G.di} fiches.</p>`;btn=`<button class="btn" id="draw" ${mine?'':'disabled'}>Trek</button>`}
  else if(G.phase==='place'){const s=SIGNS[G.drawn]||ACTIONS[G.drawn];body=`<div class="signpreview">${icon(G.drawn)}<div><strong>${s.n}</strong><small>${s.d}</small></div></div><p class="hint" style="min-height:0;margin-top:8px">${mine?'Tik een oplichtend vak om het bord te leggen. Sleep de kaart om verder te kijken.':''}</p>`}
  else if(G.phase==='remove'){body=`<div class="signpreview">${icon('D')}<div><strong>Bord weg</strong><small>Tik een rood gemarkeerd bord om het weg te halen.</small></div></div>`;btn=`<button class="btn alt" id="skipremove" ${mine?'':'disabled'}>Niets weghalen</button>`}
  else if(G.phase==='roll'){body=`<p class="hint">Gooi de dobbelsteen. Rood is 1 of 2, oranje 4 of 6, groen 3 of 5.</p>`;btn=`<button class="btn" id="roll" ${mine&&!rolling?'':'disabled'}>${rolling?'Rolt...':'Gooi'}</button>`}
  else if(G.phase==='move'){const many=opts().length>1;body=`<p class="hint">Nog <b>${G.left}</b> ${G.left===1?'stap':'stappen'}. ${many?'Tik waar je heen rijdt.':'De tuk-tuk rijdt.'}</p>`}
  else if(G.phase==='over'){const r=ranking();body=`<p class="hint">${esc(r[0].nm)} wint met ${r[0].done} afgezet.</p>`;btn=`<button class="btn" id="again">Nieuwe rit</button>`}
  if(!mine&&G.phase!=='over')body=wait;
  return `<div class="plate"><div class="turn"><span class="dot" style="background:${COLORS[G.cur]}"></span><p class="lead">${who}</p></div>${body}<div class="action">${die}${btn}</div></div>`;
}
function scoreView(){
  return `<div class="plate"><table class="tbl"><thead><tr><th>Chauffeur</th><th>Afgezet</th><th>Slokken</th></tr></thead><tbody>
  ${G.P.map((p,i)=>`<tr class="${i===G.cur&&G.phase!=='over'?'now':''}"><td><div class="who"><span class="dot" style="background:${COLORS[i]}"></span><span>${esc(p.nm)}${p.pax>=0?`<span class="car">met ${esc(PAX[G.pax[p.pax].i].n.toLowerCase())}</span>`:''}${p.skip?'<span class="car">slaat over</span>':''}</span></div></td><td>${p.done}/${G.target}</td><td>${p.sips}</td></tr>`).join('')}

function render(){
  renderBoard();

function busNext(){
  B.shown=null;B.msg='';

  if(B.players.every(p=>p.hand.length>=4)){B.py=B.deck.splice(-15);B.pyi=0;B.phase='pyramid';B.msg='Tik op Draai: heb je dezelfde lijn in de hand, dan leg je af en deel je uit.'}

  renderBus();

const pyRow=i=>i<5?1:i<9?2:i<12?3:i<14?4:5;
function busFlip(){
  const t=B.py[B.pyi],row=pyRow(B.pyi);B.pyi++;B.done++;B.msg='Lijn '+t.v+' op rij '+row+'.';
  B.players.forEach((p,i)=>{p.hand.filter(h=>h.v===t.v).forEach(h=>B.queue.push({by:i,n:row,t:h}));p.hand=p.hand.filter(h=>h.v!==t.v)});

function busToBus(){
  const left=B.players.map((p,i)=>({i,n:p.hand.length,s:p.hand.reduce((a,h)=>a+h.v,0)})).sort((a,b)=>b.n-a.n||b.s-a.s);
  if(!left[0].n){B.phase='end';B.rider=-1;B.msg='Niemand heeft nog tickets. Vandaag rijdt de bus leeg.';return renderBus()}
  B.rider=left[0].i;B.deck=newTickets();B.prev=B.deck.pop();B.pos=0;B.fails=0;B.phase='bus';
  B.msg=B.players[B.rider].nm+' heeft de meeste tickets over en moet de bus in, van Sint-Pieters tot de Overpoort.';renderBus();
}
function busRide(ans){
  const p=B.players[B.rider];if(B.deck.length<2)B.deck=newTickets();
  const t=B.deck.pop(),old=B.prev;B.prev=t;B.shown=t;
  if(t.v===old.v){B.msg='Gelijk: gratis halte, raad opnieuw.';return renderBus()}
  if(ans==='hoger'?t.v>old.v:t.v<old.v){
    B.pos++;B.msg='Goed. De bus rijdt door naar '+STOPSBUS[B.pos]+'.';
    if(B.pos>=5){B.phase='end';B.msg=p.nm+' is aan de Overpoort. Eindhalte, iedereen eruit.'}
  }else{
    p.sips+=1;B.fails++;B.pos=0;
    if(B.fails>=5){B.phase='end';B.msg='Vijf keer fout. De chauffeur heeft medelijden en zet '+p.nm+' af. Neem een glas water.'}

const itemX=it=>it.o*Math.min(Wd(it.s,it.o<0?-1:1)-34,210);
const COB=/Sint-Baafsplein|Biezekapelstraat|Hoogpoort|Zandberg|Koningstraat|Vlasmarkt/;
const TX=RX.map((_,i)=>{const a=Math.max(0,i-3),b=Math.min(RX.length-1,i+3),d=Math.hypot(RX[b]-RX[a],RZ[b]-RZ[a])||1;return(RX[b]-RX[a])/d}),TZ=RX.map((_,i)=>{const a=Math.max(0,i-3),b=Math.min(RX.length-1,i+3),d=Math.hypot(RX[b]-RX[a],RZ[b]-RZ[a])||1;return(RZ[b]-RZ[a])/d});

  return{x:RX[i]+(RX[i+1]-RX[i])*t,z:RZ[i]+(RZ[i+1]-RZ[i])*t,tx,tz};
}
const head=f=>Math.atan2(-f.tx,-f.tz);
const KAP=RX.map((_,i)=>{const a=Math.max(0,i-4),b=Math.min(RX.length-1,i+4);if(b-a<4)return 0;const t0=Math.atan2(RX[a+1]-RX[a],RZ[a+1]-RZ[a]),t1=Math.atan2(RX[b]-RX[b-1],RZ[b]-RZ[b-1]);let d=t1-t0;d=Math.atan2(Math.sin(d),Math.cos(d));return d/(RDS[b]-RDS[a])});

const spdAt=s=>SPD[Math.max(0,Math.min(SPD.length-1,Math.round(s/RSTEP)))];
const kurv=s=>KAP[Math.max(0,Math.min(KAP.length-1,Math.round(s/RSTEP)))];
const SECTIONS=GENT.s.map(([n,m],i)=>[i?m*U:0,n,['#4a4470','#5a4b6e','#8c3f3a','#3f6d59','#6f6c84','#7d5a3a','#7a3f5e'][i%7]]);

let F={phase:'lobby',players:[],code:'',peer:null,status:'',items:[],cam:0,t:0,raf:0,last:0,floats:[],keys:{},shake:0,net:false};
const roadX=s=>FW/2+Math.sin(s/1500)*105+Math.sin(s/620)*45;
const sectionAt=s=>{let c=SECTIONS[0];for(const x of SECTIONS)if(s>=x[0])c=x;return c};
function fAdd(key,nm,conn){
  if(F.players.length>=4)return null;
  const i=F.players.length,p={key,nm,conn,c:FCOL[i],in:0,boost:0,x:0,vx:0,py:430,zat:0,stun:0,safe:0,pints:0,falls:0,sips:0,fine:0,phi:i*1.7};

}
const fSend=(p,m)=>{try{if(p.conn&&p.conn.open)p.conn.send(m)}catch(e){}};
function fLobby(){
  F.phase='lobby';cancelAnimationFrame(F.raf);
  if(!F.code)F.code=Math.random().toString(36).replace(/[^a-z]/g,'').slice(0,4).padEnd(4,'x');
  fNet();fPanel();fDraw();
}
function fNet(){
  if(F.net)return;F.net=true;
  const ok=/github\.io$/.test(location.hostname)||window.__fietsTest;
  if(!ok||!window.Peer){F.status='Dit scherm kan geen gsm koppelen. Open de GitHub-link van Spelcafé, of speel met de toetsen.';F.offline=true;return}
  F.status='Tafel wordt klaargezet.';
  const peer=new Peer('spelcafe-fiets-'+F.code);F.peer=peer;
  peer.on('open',()=>{F.status='Scan de code met je gsm.';fPanel()});
  peer.on('error',e=>{F.status='De verbinding lukte niet ('+(e.type||'fout')+'). Herlaad de pagina of speel met de toetsen.';fPanel()});
  peer.on('connection',conn=>{
    conn.on('data',m=>fMsg(conn,m));
    conn.on('close',()=>{const p=F.players.find(x=>x.conn===conn);if(p){p.gone=true;p.in=0;if(F.phase==='lobby')F.players=F.players.filter(x=>x!==p);fPanel()}});
  });
}
function fMsg(conn,m){
  if(!m||typeof m!=='object')return;
  if(typeof m.j==='string'){
    let p=F.players.find(x=>x.conn===conn);
    const name=m.j.trim().slice(0,12)||'Fietser';
    if(!p){if(F.phase!=='lobby'){conn.send({full:'De rit is al bezig. Wacht op de volgende.'});return}
      p=fAdd(conn.peer,name,conn);if(!p){conn.send({full:'De fietsenstalling is vol: maximum 4 fietsers.'});return}}
    conn.send({ok:1,c:p.c,n:p.nm});fPanel();fDraw();return;
  }
  const p=F.players.find(x=>x.conn===conn);
  if(p&&Array.isArray(m.s)){p.in=Math.max(-1,Math.min(1,+m.s[0]||0))}
}
function fItems(){
  const a=[];if(EMPTY)return a;let s=1800;
  const types=['paal','put','fiets','duif','tram','mens'];
  while(s<TOTAL-2600){
    const hard=s/TOTAL,o=(Math.random()*2-1)*.85,kind=Math.random();
    if(kind<.34)a.push({k:'pint',s,o});
    else if(kind<.42)a.push({k:'water',s,o});
    else if(kind<.48&&s>9000)a.push({k:'agent',s,o});
    else{a.push({k:types[Math.floor(Math.random()*types.length)],s,o,v:Math.random()<.5?1:-1});
      if(Math.random()<hard*.7)a.push({k:'paal',s:s+20,o:-o*.8});}
    s+=(230-hard*90+Math.random()*90)*3.3;
  }
  return a;
}
function fStart(){
  if(!F.players.length)fAdd('key1','Pijltjes',null);
  F.items=fItems();F.cam=0;F.t=0;F.floats=[];F.phase='play';
  const n=F.players.length;
  F.players.forEach((p,i)=>{Object.assign(p,{x:(i-(n-1)/2)*80,vx:0,py:430,zat:0,stun:0,safe:0,pints:0,falls:0,sips:0,fine:0,done:false});fSend(p,{go:1})});
  F.last=performance.now();fPanel();F.raf=requestAnimationFrame(fLoop);
}
function fFloat(p,t,col){const s=F.cam+FH-p.py,f=fr(s);F.floats.push({x:roadX(s)+p.x,y:p.py-40,wx:f.x-f.tz*p.x,wz:f.z+f.tx*p.x,h:0,t,col,a:1.4})}
function fFall(p,why,n=1){
  if(p.safe>0)return;
  p.stun=1.3;p.safe=2.6;p.falls++;p.sips+=n;p.vx=0;p.py=Math.min(505,p.py+45);
  fFloat(p,p.nm+': '+why+'. '+n+(n===1?' slok':' slokken'),'#ff6b6b');
  F.shake=.4;fSend(p,{fall:why,n});
}
function fStep(dt){
  F.t+=dt;F.speed=RIDE*spdAt(F.cam+FH-430);F.cam+=F.speed*dt;F.shake=Math.max(0,F.shake-dt);
  for(const it of F.items)if(it.k==='mens'||it.k==='duif'){const near=it.s-F.cam;if(near>-300&&near<2600&&!it.hit){it.o+=(it.v||1)*dt*(it.k==='mens'?.45:.2);if(Math.abs(it.o)>.92)it.v=-(it.v||1)}}
  F.players.forEach(p=>{
    const s=F.cam+FH-p.py,cx=roadX(s),cobble=COB.test(sectionAt(s)[1]);
    p.safe=Math.max(0,p.safe-dt);
    if(p.stun>0){p.stun-=dt;p.x+=(0-p.x)*dt*1.2;return}
    let inp=p.in;
    if(p.key==='key1')inp=(F.keys.ArrowRight?1:0)-(F.keys.ArrowLeft?1:0);
    if(p.key==='key2')inp=(F.keys.KeyD?1:0)-(F.keys.KeyA?1:0);
    const k=11-8*p.zat, sway=Math.sin(F.t*(1.8+p.zat)+p.phi)*p.zat*(150)+(cobble&&!EMPTY?Math.sin(F.t*17+p.phi)*38:0);
    p.vx+=((inp*440+sway)-p.vx)*Math.min(1,dt*k);

      else if(it.k==='water'&&dx<34){it.hit=1;p.zat=Math.max(0,p.zat-.3);fFloat(p,'Water, helderder','#7fd4ff');fSend(p,{z:p.zat})}

function fScore(p){return p.pints*10-p.falls*15+0}
function fRank(){return F.players.slice().sort((a,b)=>fScore(b)-fScore(a))}
function fEnd(){
  F.phase='end';cancelAnimationFrame(F.raf);

  r.forEach((p,i)=>fSend(p,{end:i+1,score:fScore(p),sips:p.sips}));

function fLoop(now){

function fHouse(c,x,y,w,h,col,seed,side){
  c.fillStyle=col;c.fillRect(x,y,w,h);c.fillStyle='rgba(0,0,0,.2)';c.fillRect(side<0?x+w-10:x,y,10,h);
  for(let i=0;i<3;i++)for(let k=0;k<2;k++){c.fillStyle=(seed+i*3+k)%3?'#ffd97a':'rgba(255,255,255,.15)';c.fillRect(x+16+k*(w-52),y+12+i*(h-30)/3,18,12)}
}
function fObj(c,k,x,y,t){
  if(k==='pint'){c.fillStyle='#e8a800';c.fillRect(x-11,y-14,22,28);c.fillStyle='#fff8e6';c.beginPath();c.arc(x,y-14,13,Math.PI,0);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.strokeRect(x+11,y-7,7,13)}

  else if(k==='paal'){c.fillStyle='#14122c';c.beginPath();c.arc(x,y,13,0,7);c.fill();c.fillStyle='#d3202a';c.beginPath();c.arc(x,y,9,0,7);c.fill();c.fillStyle='#fff';c.fillRect(x-9,y-2,18,4)}

  else if(k==='duif'){[[-14,0],[12,-9],[6,11]].forEach(([a,b])=>{c.fillStyle='#b9b4c4';c.beginPath();c.ellipse(x+a,y+b,10,6,0,0,7);c.fill();c.fillStyle='#6f6c84';c.beginPath();c.arc(x+a+8,y+b-2,3.5,0,7);c.fill()})}

function fRider(c,p,x,y){

  c.fillStyle='#3d1f2c';c.fillRect(cx-w/2,y-222,w,14);

function fDraw2D(){

  if(!calm){c.translate(FW/2,FH/2);c.rotate(Math.sin(F.t*.9)*.022*top);c.translate(-FW/2,-FH/2);if(F.shake>0)c.translate((Math.random()-.5)*12,(Math.random()-.5)*12)}

    c.fillStyle=COB.test(sectionAt(yy)[1])?'#57546e':'#3f3c58';c.fillRect(cx-ROADW/2,y,ROADW,step+1);

/* ---------- gsm als stuur ---------- */
let S={conn:null,tilt:0,boost:0,left:0,right:0,timer:0,tiltOk:false,lock:null};
function stuurScreen(html){document.getElementById('stuur').innerHTML=html}
function stuurJoin(code){
  stuurScreen(`<div class="st"><p class="stlogo">Dronken fietsen</p><p class="stline">Je gsm wordt het stuur.</p><label for="stnm">Jouw naam</label><input id="stnm" maxlength="12" autocomplete="off" value=""><button class="btn" id="stgo">Stap op de fiets</button><p class="small">Draai je gsm horizontaal en hou hem vast als een stuur. Alleen voor 18+.</p></div>`);
  document.getElementById('stgo').addEventListener('click',async()=>{
    const nm=document.getElementById('stnm').value.trim()||'Fietser';
    try{if(window.DeviceOrientationEvent&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();S.tiltOk=r==='granted'}else S.tiltOk='DeviceOrientationEvent' in window}catch(e){S.tiltOk=false}
    try{S.lock=await navigator.wakeLock.request('screen')}catch(e){}
    try{await document.documentElement.requestFullscreen();await screen.orientation.lock('landscape')}catch(e){}
    stuurConnect(code,nm);
  });
}
function stuurConnect(code,nm){
  stuurScreen(`<div class="st"><p class="stline">Verbinden met de tafel...</p></div>`);
  if(!window.Peer)return stuurFail('De verbinding kon niet laden. Controleer je internet.');
  const peer=new Peer();
  const fail=setTimeout(()=>stuurFail('Geen verbinding met de tafel. Probeer hetzelfde wifi als het scherm, en scan opnieuw.'),15000);
  peer.on('error',e=>{clearTimeout(fail);stuurFail(e.type==='peer-unavailable'?'Die tafel bestaat niet meer. Scan de code op het scherm opnieuw.':'De verbinding viel weg. Scan de code opnieuw.')});
  peer.on('open',()=>{
    const conn=peer.connect('spelcafe-fiets-'+code,{serialization:'json'});S.conn=conn;
    conn.on('open',()=>{clearTimeout(fail);conn.send({j:nm})});
    conn.on('data',stuurData);
    conn.on('close',()=>stuurFail('De tafel is gesloten.'));
  });
}
function stuurFail(t){clearInterval(S.timer);stuurScreen(`<div class="st"><p class="stline">${esc(t)}</p></div>`)}
function stuurData(m){
  if(m.full)return stuurFail(m.full);
  if(m.ok){S.c=m.c;S.n=m.n;stuurPlay();stuurMsg('Klaar. Wacht op de start op het grote scherm.','')}
  if(m.go)stuurMsg('Rijden!','');
  if(m.lobby)stuurMsg('Nieuwe rit in aanmaak.','');
  if(m.fall){stuurMsg('Gevallen: '+m.fall,'Drink '+m.n+(m.n===1?' slok':' slokken'),1);try{navigator.vibrate&&navigator.vibrate([200,80,200])}catch(e){}}
  if(typeof m.z==='number'){const e=document.getElementById('stz');if(e)e.style.width=Math.round(m.z*100)+'%'}
  if(m.end)stuurMsg('Plaats '+m.end+' aan Bar des Amis',m.score+' punten, '+m.sips+' slokken');
}
function stuurMsg(a,b,bad){const e=document.getElementById('stmsg');if(e){e.className='stmsg'+(bad?' bad':'');e.innerHTML=`<b>${esc(a)}</b><span>${esc(b)}</span>`}}
function stuurPlay(){
  stuurScreen(`<div class="stplay ${S.seen?'tilt':''}" style="--me:${S.c}"><p class="stturn">Draai je gsm horizontaal</p><div class="stname">${esc(S.n)}<span class="zat"><i id="stz" style="width:0"></i></span></div><div id="stmsg" class="stmsg"></div>
   <svg id="stwheel" viewBox="-100 -100 200 200" aria-hidden="true"><circle r="86" fill="none" stroke="${S.c}" stroke-width="16"/><path d="M-82 0H82M0 0V82" stroke="${S.c}" stroke-width="12"/><circle r="20" fill="${S.c}"/></svg>
   <div class="stbtns"><button id="stl" aria-label="Links">Links</button><button id="str" aria-label="Rechts">Rechts</button></div></div>`);
  const hold=(id,k)=>{const b=document.getElementById(id);const d=e=>{e.preventDefault();S[k]=1;b.classList.add('on')},u=e=>{S[k]=0;b.classList.remove('on')};b.addEventListener('pointerdown',d);['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,u));b.addEventListener('contextmenu',e=>e.preventDefault())};

    const btn=S.right-S.left, x=btn||S.tilt;
    const w=document.getElementById('stwheel');if(w)w.style.transform=`rotate(${x*80}deg)`;
    if(S.conn&&S.conn.open)try{S.conn.send({s:[+x.toFixed(2)]})}catch(e){}

}
addEventListener('deviceorientation',e=>{
  if(e.gamma==null)return;
